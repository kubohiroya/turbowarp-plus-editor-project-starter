name: Release

# The family's standard release: a pushed v<version> tag is checked, packed, attached to the
# GitHub Release and published to npm through trusted publishing (OIDC). No npm token is stored.
#
# npmjs.com side (package Settings -> Trusted publisher) must name:
#   Organization or user  kubohiroya
#   Repository            turbowarp-plus-project-folder-starter
#   Workflow filename     release.yml   <- the filename alone
#   Environment           (empty)
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to verify and complete
        required: true
        type: string
      node_version:
        description: Node version used to produce the existing npm archive
        required: true
        default: "26"
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node_version || '26' }}
          cache: npm
        # No registry-url: it writes an .npmrc with a placeholder token, and npm sends a configured
        # token instead of exchanging the workflow identity, so publishing fails with
        # "OIDC permission denied".
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Check the tag names the package version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${RELEASE_TAG#v}" != "$version" ]; then
            echo "::error::Tag $RELEASE_TAG does not name package.json version $version."
            exit 1
          fi
      - name: Pack the npm archive
        id: pack
        run: |
          mkdir -p "$RUNNER_TEMP/npm"
          npm pack --ignore-scripts --json --pack-destination "$RUNNER_TEMP/npm" > "$RUNNER_TEMP/pack.json"
          file="$(node -p "const r = require(process.env.RUNNER_TEMP + '/pack.json'); (Array.isArray(r) ? r[0] : Object.values(r)[0]).filename")"
          echo "file=$RUNNER_TEMP/npm/$file" >> "$GITHUB_OUTPUT"
      - name: Verify the published archive for a manual retry
        if: github.event_name == 'workflow_dispatch'
        env:
          NPM_ARCHIVE: ${{ steps.pack.outputs.file }}
        run: |
          set -euo pipefail
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          export SOURCE_REVISION="$(git rev-parse HEAD)"
          export PUBLISHED_METADATA="$RUNNER_TEMP/published-package.json"
          npm view "$name@$version" --json --prefer-online > "$PUBLISHED_METADATA"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          import {readFile, writeFile} from 'node:fs/promises';
          import {gunzipSync} from 'node:zlib';
          const pkg = JSON.parse(await readFile('package.json', 'utf8'));
          const metadata = JSON.parse(await readFile(process.env.PUBLISHED_METADATA, 'utf8'));
          assert.equal(metadata.name, pkg.name, 'Published package name differs');
          assert.equal(metadata.version, pkg.version, 'Published package version differs');
          assert.equal(metadata.gitHead, process.env.SOURCE_REVISION, 'Published source commit differs');
          const response = await fetch(metadata.dist.tarball, {signal: AbortSignal.timeout(30000)});
          assert.ok(response.ok, 'Published archive download failed');
          const published = Buffer.from(await response.arrayBuffer());
          assert.equal(createHash('sha1').update(published).digest('hex'), metadata.dist.shasum, 'Published archive SHA-1 differs');
          assert.equal('sha512-' + createHash('sha512').update(published).digest('base64'), metadata.dist.integrity, 'Published archive integrity differs');
          const local = await readFile(process.env.NPM_ARCHIVE);
          assert.ok(gunzipSync(local).equals(gunzipSync(published)), 'Published archive contents differ');
          // Keep the registry's exact bytes after verifying the source and complete tar payload.
          await writeFile(process.env.NPM_ARCHIVE, published);
          console.log('Verified published source, integrity and tar payload; using the existing archive.');
          NODE
      - name: Attach to the GitHub Release
        # An attachment that already exists must be byte-identical: a release driver may have
        # uploaded its locally verified archive first, and a differing CI build stops here,
        # before anything reaches npm.
        env:
          GH_TOKEN: ${{ github.token }}
          NPM_ARCHIVE: ${{ steps.pack.outputs.file }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            prerelease=()
            case "$version" in *-*) prerelease=(--prerelease) ;; esac
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$name $version" --generate-notes "${prerelease[@]}" ||
              gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null
          fi
          existing="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq '.assets[] | "\(.name)\t\(.digest)"')"
          want="sha256:$(sha256sum "$NPM_ARCHIVE" | cut -d' ' -f1)"
          have="$(printf '%s\n' "$existing" | awk -F'\t' -v n="$(basename "$NPM_ARCHIVE")" '$1 == n { print $2 }')"
          if [ -z "$have" ]; then
            gh release upload "$tag" "$NPM_ARCHIVE" --repo "$GITHUB_REPOSITORY"
          elif [ "$have" != "$want" ]; then
            echo "::error::$(basename "$NPM_ARCHIVE") is already attached with different content."
            exit 1
          fi
      - name: Use an npm that supports trusted publishing
        run: npm install --global npm@11.21.0
      - name: Publish to npm
        # Last step: a failed check or mismatched tag stops the release before the registry,
        # where a version cannot be replaced.
        env:
          NPM_ARCHIVE: ${{ steps.pack.outputs.file }}
        run: |
          set -euo pipefail
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          want="$(sha1sum "$NPM_ARCHIVE" | cut -d' ' -f1)"
          have="$(npm view "$name@$version" dist.shasum --prefer-online 2> /dev/null || true)"
          if [ -n "$have" ]; then
            if [ "$have" != "$want" ]; then
              echo "::error::$name@$version is already published with different content."
              exit 1
            fi
            echo "$name@$version is already published with this archive."
          else
            dist_tag="$(node -p "require('./package.json').publishConfig?.tag ?? ''")"
            if [ -z "$dist_tag" ]; then
              case "$version" in *-*) dist_tag=next ;; *) dist_tag=latest ;; esac
            fi
            npm publish "$NPM_ARCHIVE" --access public --provenance --tag "$dist_tag"
          fi
          # Accepting a publish and serving it differ; wait for the registry itself.
          for attempt in $(seq 1 60); do
            have="$(npm view "$name@$version" dist.shasum --prefer-online 2> /dev/null || true)"
            [ -n "$have" ] && break
            sleep 10
          done
          if [ "$have" != "$want" ]; then
            echo "::error::The registry does not serve $name@$version with the packed archive."
            exit 1
          fi
      - name: Point latest and next at this release
        # The family keeps both dist-tags on the newest verified release
        # (kubohiroya/turbowarp-plus-packages#16).
        run: |
          set -euo pipefail
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          for tag in latest next; do
            if [ "$(npm view "$name" "dist-tags.$tag" --prefer-online 2> /dev/null || true)" != "$version" ]; then
              npm dist-tag add "$name@$version" "$tag"
            fi
          done
