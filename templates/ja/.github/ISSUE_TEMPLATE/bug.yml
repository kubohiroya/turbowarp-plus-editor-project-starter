name: 不具合
description: 作品が思った通りに動かないとき
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: 何が起きたか
      description: どのスプライトで、何をしたら、どうなったか
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 本当はどうなってほしいか
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 起こし方
      placeholder: |
        1. 緑の旗を押す
        2. スペースキーを3回押す
  - type: input
    id: version
    attributes:
      label: 遊んだ版
      description: Releases の版の名前か、コミットの ID
